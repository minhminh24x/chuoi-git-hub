name: Daily Commit - Duy tri chuoi 365 ngay + Art

on:
  schedule:
    # Chay luc 14:00 UTC = 21:00 gio Viet Nam (GMT+7)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Read pattern and create commits
        run: |
          export TZ='Asia/Ho_Chi_Minh'
          
          TODAY=$(date +'%Y-%m-%d')
          TODAY_DISPLAY=$(date +'%d/%m/%Y')
          DAY_OF_YEAR=$(date +'%j' | sed 's/^0*//')
          TIME=$(date +'%H:%M:%S')
          
          # Đọc số commits cần tạo từ pattern file
          if [ -f "commit-pattern.json" ]; then
            COMMIT_COUNT=$(cat commit-pattern.json | grep "\"$TODAY\"" | grep -o '[0-9]*' | tail -1)
          fi
          
          # Default là 1 nếu không tìm thấy
          if [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -lt 1 ]; then
            COMMIT_COUNT=1
          fi
          
          echo "📅 Ngày: $TODAY_DISPLAY"
          echo "📊 Số commits cần tạo: $COMMIT_COUNT"
          
          # Cấu hình git - QUAN TRỌNG: Email phải khớp với email GitHub của bạn!
          git config --local user.email "loclm9824@gmail.com"
          git config --local user.name "minhminh24x"
          
          # Random emoji
          EMOJIS=("🌟" "💪" "🚀" "✨" "🎯" "🌱" "💡" "⚡" "🔥" "🎉")
          
          mkdir -p logs
          
          # Cập nhật README.md với ngày hiện tại
          echo "# 🌟 Hành Trình 365 Ngày - 2026" > README.md
          echo "" >> README.md
          echo "> *\"Mỗi ngày một bước nhỏ, cả năm một hành trình vĩ đại.\"*" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "## 📅 Ngày $DAY_OF_YEAR/365 - $TODAY_DISPLAY" >> README.md
          echo "" >> README.md
          echo "**Hôm nay là ngày thứ $DAY_OF_YEAR của hành trình 1 năm.**" >> README.md
          echo "" >> README.md
          echo "Đây không chỉ là về việc giữ chuỗi GitHub xanh. Đây là lời hứa với bản thân:" >> README.md
          echo "- 🎯 Mỗi ngày đều có ý nghĩa" >> README.md
          echo "- 💪 Kiên trì là chìa khóa của thành công" >> README.md
          echo "- 🌱 Từng commit nhỏ sẽ tạo nên những điều lớn lao" >> README.md
          echo "" >> README.md
          echo "### ✨ Lời nhắn cho chính mình" >> README.md
          echo "" >> README.md
          echo "\`\`\`" >> README.md
          echo "Năm mới, trang mới, con người mới." >> README.md
          echo "Đừng sợ thất bại, hãy sợ không dám bắt đầu." >> README.md
          echo "365 ngày sau, hãy nhìn lại và tự hào về những gì đã làm được!" >> README.md
          echo "\`\`\`" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "## 📊 Thống kê" >> README.md
          echo "" >> README.md
          echo "| Năm | Ngày đã commit | Mục tiêu |" >> README.md
          echo "|-----|----------------|----------|" >> README.md
          echo "| 2026 | $DAY_OF_YEAR | 365 |" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "*\"Cuộc hành trình ngàn dặm bắt đầu từ một bước chân.\" - Lão Tử*" >> README.md
          echo "" >> README.md
          echo "🚀 **Let's go 2026!**" >> README.md
          
          # Tạo đúng số commits
          for i in $(seq 1 $COMMIT_COUNT); do
            RANDOM_EMOJI=${EMOJIS[$RANDOM % ${#EMOJIS[@]}]}
            
            # Cập nhật log
            echo "" >> logs/commit-log.md
            echo "## $RANDOM_EMOJI Day $DAY_OF_YEAR/365 - $TODAY_DISPLAY (Commit $i/$COMMIT_COUNT)" >> logs/commit-log.md
            echo "- Time: $TIME" >> logs/commit-log.md
            echo "---" >> logs/commit-log.md
            
            git add .
            git commit -m "$RANDOM_EMOJI Day $DAY_OF_YEAR - $TODAY_DISPLAY [$i/$COMMIT_COUNT]"
            
            echo "✅ Commit $i/$COMMIT_COUNT done"
          done
          
          # Push tất cả commits
          git push
          
          echo "🎉 Hoàn thành $COMMIT_COUNT commits cho ngày $TODAY_DISPLAY!"

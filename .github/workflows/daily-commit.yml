name: 🚀 Daily Commit - GitHub Streak Keeper 2026

on:
  schedule:
    # Chạy lúc 14:00 UTC = 21:00 giờ Việt Nam (GMT+7)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: 🎯 Generate daily commit with full features
        run: |
          export TZ='Asia/Ho_Chi_Minh'
          
          # ═══════════════════════════════════════════════════════════
          # 📅 VARIABLES
          # ═══════════════════════════════════════════════════════════
          TODAY=$(date +'%Y-%m-%d')
          TODAY_DISPLAY=$(date +'%d/%m/%Y')
          DAY_OF_YEAR=$(date +'%j' | sed 's/^0*//')
          TIME=$(date +'%H:%M:%S')
          HOUR=$(date +'%H')
          DAY_OF_WEEK=$(date +'%A')
          
          # ═══════════════════════════════════════════════════════════
          # 📊 READ PATTERN & STATS
          # ═══════════════════════════════════════════════════════════
          if [ -f "commit-pattern.json" ]; then
            COMMIT_COUNT=$(cat commit-pattern.json | grep "\"$TODAY\"" | grep -o '[0-9]*' | tail -1)
          fi
          
          if [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -lt 1 ]; then
            COMMIT_COUNT=1
          fi
          
          # Read current stats
          if [ -f "data/stats.json" ]; then
            CURRENT_STREAK=$(cat data/stats.json | grep '"currentStreak"' | grep -o '[0-9]*')
            TOTAL_COMMITS=$(cat data/stats.json | grep '"totalCommits"' | grep -o '[0-9]*')
          else
            CURRENT_STREAK=0
            TOTAL_COMMITS=0
          fi
          
          # Update stats
          NEW_STREAK=$((CURRENT_STREAK + 1))
          NEW_TOTAL=$((TOTAL_COMMITS + COMMIT_COUNT))
          PROGRESS=$(echo "scale=1; $DAY_OF_YEAR * 100 / 365" | bc)
          PROGRESS_WIDTH=$(echo "scale=0; $DAY_OF_YEAR * 700 / 365" | bc)
          
          echo "📅 Ngày: $TODAY_DISPLAY (Day $DAY_OF_YEAR/365)"
          echo "🔥 Streak: $NEW_STREAK ngày"
          echo "💻 Total commits: $NEW_TOTAL"
          echo "📊 Progress: $PROGRESS%"
          
          # ═══════════════════════════════════════════════════════════
          # 🎰 RANDOM QUOTE
          # ═══════════════════════════════════════════════════════════
          QUOTES_COUNT=$(cat data/quotes.json | grep '"text"' | wc -l)
          RANDOM_INDEX=$((RANDOM % QUOTES_COUNT))
          QUOTE=$(cat data/quotes.json | grep '"text"' | sed -n "$((RANDOM_INDEX + 1))p" | sed 's/.*"text": "\(.*\)".*/\1/' | cut -c1-60)
          
          # Check for milestone quote
          MILESTONE_QUOTE=""
          for milestone in 7 30 50 100 150 182 200 300 365; do
            if [ "$NEW_STREAK" -eq "$milestone" ]; then
              MILESTONE_QUOTE=$(cat data/quotes.json | grep "\"$milestone\":" | sed 's/.*": "\(.*\)".*/\1/')
              break
            fi
          done
          
          if [ -n "$MILESTONE_QUOTE" ]; then
            DISPLAY_QUOTE="$MILESTONE_QUOTE"
          else
            DISPLAY_QUOTE="$QUOTE"
          fi
          
          # ═══════════════════════════════════════════════════════════
          # 🏆 CHECK ACHIEVEMENTS
          # ═══════════════════════════════════════════════════════════
          UNLOCKED_BADGES=""
          
          # Streak-based achievements
          declare -A STREAK_BADGES
          STREAK_BADGES[1]="🎬"
          STREAK_BADGES[7]="🔥"
          STREAK_BADGES[14]="⚔️"
          STREAK_BADGES[30]="🌙"
          STREAK_BADGES[50]="⭐"
          STREAK_BADGES[100]="💯"
          STREAK_BADGES[182]="🎯"
          STREAK_BADGES[300]="🛡️"
          STREAK_BADGES[365]="👑"
          
          for streak in 1 7 14 30 50 100 182 300 365; do
            if [ "$NEW_STREAK" -ge "$streak" ]; then
              UNLOCKED_BADGES="$UNLOCKED_BADGES${STREAK_BADGES[$streak]} "
            fi
          done
          
          # Time-based achievements
          if [ "$HOUR" -lt "06" ]; then
            UNLOCKED_BADGES="$UNLOCKED_BADGES🌅 "
          fi
          if [ "$HOUR" -ge "23" ]; then
            UNLOCKED_BADGES="$UNLOCKED_BADGES🦉 "
          fi
          
          # Commit count achievements
          if [ "$NEW_TOTAL" -ge 100 ]; then
            UNLOCKED_BADGES="$UNLOCKED_BADGES🏛️ "
          fi
          if [ "$NEW_TOTAL" -ge 500 ]; then
            UNLOCKED_BADGES="$UNLOCKED_BADGES🎖️ "
          fi
          
          echo "🏆 Badges: $UNLOCKED_BADGES"
          
          # ═══════════════════════════════════════════════════════════
          # 📝 UPDATE STATS.JSON
          # ═══════════════════════════════════════════════════════════
          cat > data/stats.json << STATS_EOF
          {
            "currentStreak": $NEW_STREAK,
            "longestStreak": $NEW_STREAK,
            "totalCommits": $NEW_TOTAL,
            "startDate": "2026-01-01",
            "lastCommitDate": "$TODAY",
            "targetDays": 365,
            "dayOfYear": $DAY_OF_YEAR,
            "progress": "$PROGRESS%",
            "achievements": "$UNLOCKED_BADGES"
          }
          STATS_EOF
          
          # ═══════════════════════════════════════════════════════════
          # 🎨 UPDATE SVG BANNER
          # ═══════════════════════════════════════════════════════════
          cp assets/banner-template.svg assets/banner.svg
          sed -i "s/DAY_NUM/$DAY_OF_YEAR/g" assets/banner.svg
          sed -i "s/STREAK_NUM/$NEW_STREAK/g" assets/banner.svg
          sed -i "s/COMMIT_NUM/$NEW_TOTAL/g" assets/banner.svg
          sed -i "s/PERCENT/$PROGRESS/g" assets/banner.svg
          sed -i "s/PROGRESS_WIDTH/$PROGRESS_WIDTH/g" assets/banner.svg
          sed -i "s/QUOTE_TEXT/$DISPLAY_QUOTE/g" assets/banner.svg
          
          # ═══════════════════════════════════════════════════════════
          # 📄 UPDATE README.MD
          # ═══════════════════════════════════════════════════════════
          PROGRESS_BAR=""
          FILLED=$((DAY_OF_YEAR * 20 / 365))
          EMPTY=$((20 - FILLED))
          for i in $(seq 1 $FILLED); do PROGRESS_BAR="${PROGRESS_BAR}█"; done
          for i in $(seq 1 $EMPTY); do PROGRESS_BAR="${PROGRESS_BAR}░"; done
          
          cat > README.md << 'README_START'
          # 🌟 Hành Trình 365 Ngày - 2026
          
          <div align="center">
          
          ![GitHub Streak Banner](assets/banner.svg)
          
          [![Daily Commit](https://github.com/minhminh24x/chuoi-git-hub/actions/workflows/daily-commit.yml/badge.svg)](https://github.com/minhminh24x/chuoi-git-hub/actions/workflows/daily-commit.yml)
          
          </div>
          
          > *"Mỗi ngày một bước nhỏ, cả năm một hành trình vĩ đại."*
          
          ---
          
          README_START
          
          cat >> README.md << README_STATS
          ## 📅 Ngày $DAY_OF_YEAR/365 - $TODAY_DISPLAY
          
          **Hôm nay là ngày thứ $DAY_OF_YEAR của hành trình 1 năm.**
          
          ### 📊 Thống Kê Real-time
          
          | Metric | Value |
          |--------|-------|
          | 🔥 **Current Streak** | $NEW_STREAK ngày |
          | 💻 **Total Commits** | $NEW_TOTAL |
          | 📈 **Progress** | $PROGRESS% |
          | 🎯 **Target** | 365 ngày |
          
          ### 🎮 Progress Bar
          
          \`\`\`
          $PROGRESS_BAR $PROGRESS% ($DAY_OF_YEAR/365)
          \`\`\`
          
          README_STATS
          
          cat >> README.md << README_ACHIEVEMENTS
          ### 🏆 Achievements Unlocked
          
          $UNLOCKED_BADGES
          
          <details>
          <summary>📋 Xem tất cả achievements</summary>
          
          | Badge | Tên | Điều kiện | Status |
          |-------|-----|-----------|--------|
          README_ACHIEVEMENTS
          
          # Add achievement table rows
          echo "| 🎬 | Khởi Đầu | 1 ngày | ✅ |" >> README.md
          if [ "$NEW_STREAK" -ge 7 ]; then echo "| 🔥 | First Week | 7 ngày | ✅ |" >> README.md; else echo "| 🔥 | First Week | 7 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 14 ]; then echo "| ⚔️ | Fortnight | 14 ngày | ✅ |" >> README.md; else echo "| ⚔️ | Fortnight | 14 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 30 ]; then echo "| 🌙 | Monthly | 30 ngày | ✅ |" >> README.md; else echo "| 🌙 | Monthly | 30 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 50 ]; then echo "| ⭐ | Half Century | 50 ngày | ✅ |" >> README.md; else echo "| ⭐ | Half Century | 50 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 100 ]; then echo "| 💯 | Century | 100 ngày | ✅ |" >> README.md; else echo "| 💯 | Century | 100 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 182 ]; then echo "| 🎯 | Halfway | 182 ngày | ✅ |" >> README.md; else echo "| 🎯 | Halfway | 182 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 300 ]; then echo "| 🛡️ | Spartan | 300 ngày | ✅ |" >> README.md; else echo "| 🛡️ | Spartan | 300 ngày | ⏳ |" >> README.md; fi
          if [ "$NEW_STREAK" -ge 365 ]; then echo "| 👑 | Champion | 365 ngày | ✅ |" >> README.md; else echo "| 👑 | Champion | 365 ngày | ⏳ |" >> README.md; fi
          
          echo "" >> README.md
          echo "</details>" >> README.md
          echo "" >> README.md
          
          cat >> README.md << README_QUOTE
          ---
          
          ### 💬 Quote Hôm Nay
          
          > *"$DISPLAY_QUOTE"*
          
          ---
          
          ### ✨ Lời nhắn cho chính mình
          
          \`\`\`
          Năm mới, trang mới, con người mới.
          Đừng sợ thất bại, hãy sợ không dám bắt đầu.
          365 ngày sau, hãy nhìn lại và tự hào về những gì đã làm được!
          \`\`\`
          
          ---
          
          *"Cuộc hành trình ngàn dặm bắt đầu từ một bước chân."* - Lão Tử
          
          🚀 **Let's go 2026!**
          README_QUOTE
          
          # ═══════════════════════════════════════════════════════════
          # 🔧 GIT CONFIG
          # ═══════════════════════════════════════════════════════════
          git config --local user.email "loclm9824@gmail.com"
          git config --local user.name "minhminh24x"
          
          # ═══════════════════════════════════════════════════════════
          # 🚀 CREATE COMMITS
          # ═══════════════════════════════════════════════════════════
          EMOJIS=("🌟" "💪" "🚀" "✨" "🎯" "🌱" "💡" "⚡" "🔥" "🎉")
          
          mkdir -p logs
          
          for i in $(seq 1 $COMMIT_COUNT); do
            RANDOM_EMOJI=${EMOJIS[$RANDOM % ${#EMOJIS[@]}]}
            
            # Update log
            echo "" >> logs/commit-log.md
            echo "## $RANDOM_EMOJI Day $DAY_OF_YEAR/365 - $TODAY_DISPLAY (Commit $i/$COMMIT_COUNT)" >> logs/commit-log.md
            echo "- ⏰ Time: $TIME" >> logs/commit-log.md
            echo "- 🔥 Streak: $NEW_STREAK days" >> logs/commit-log.md
            echo "- 💻 Total: $NEW_TOTAL commits" >> logs/commit-log.md
            echo "---" >> logs/commit-log.md
            
            git add .
            git commit -m "$RANDOM_EMOJI Day $DAY_OF_YEAR/365 - $TODAY_DISPLAY | Streak: $NEW_STREAK 🔥 | [$i/$COMMIT_COUNT]"
            
            echo "✅ Commit $i/$COMMIT_COUNT done"
          done
          
          # Push all commits
          git push
          
          echo "🎉 Hoàn thành $COMMIT_COUNT commits cho ngày $TODAY_DISPLAY!"
          echo "📊 Progress: $PROGRESS% | Streak: $NEW_STREAK days | Total: $NEW_TOTAL commits"

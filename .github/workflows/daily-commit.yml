name: 🚀 Daily Commit - GitHub Streak Keeper 2026

on:
  schedule:
    - cron: '0 14 * * *'  # 21:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: 🎯 Generate daily commit with full features
        run: |
          export TZ='Asia/Ho_Chi_Minh'
          
          # ═══════════════════════════════════════════════════════════
          # 📅 VARIABLES
          # ═══════════════════════════════════════════════════════════
          TODAY=$(date +'%Y-%m-%d')
          TODAY_DISPLAY=$(date +'%d/%m/%Y')
          DAY_OF_YEAR=$(date +'%j' | sed 's/^0*//')
          TIME=$(date +'%H:%M:%S')
          HOUR=$(date +'%H')
          
          # ═══════════════════════════════════════════════════════════
          # 📊 READ PATTERN & STATS
          # ═══════════════════════════════════════════════════════════
          COMMIT_COUNT=1
          if [ -f "commit-pattern.json" ]; then
            COMMIT_COUNT=$(cat commit-pattern.json | grep "\"$TODAY\"" | grep -o '[0-9]*' | tail -1)
          fi
          [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -lt 1 ] && COMMIT_COUNT=1
          
          CURRENT_STREAK=0
          TOTAL_COMMITS=0
          if [ -f "data/stats.json" ]; then
            CURRENT_STREAK=$(cat data/stats.json | grep '"currentStreak"' | grep -o '[0-9]*' | head -1)
            TOTAL_COMMITS=$(cat data/stats.json | grep '"totalCommits"' | grep -o '[0-9]*' | head -1)
          fi
          [ -z "$CURRENT_STREAK" ] && CURRENT_STREAK=0
          [ -z "$TOTAL_COMMITS" ] && TOTAL_COMMITS=0
          
          NEW_STREAK=$((CURRENT_STREAK + 1))
          NEW_TOTAL=$((TOTAL_COMMITS + COMMIT_COUNT))
          PROGRESS=$(echo "scale=1; $DAY_OF_YEAR * 100 / 365" | bc)
          PROGRESS_WIDTH=$(echo "scale=0; $DAY_OF_YEAR * 700 / 365" | bc)
          
          echo "📅 Day $DAY_OF_YEAR/365 | 🔥 Streak: $NEW_STREAK | 💻 Total: $NEW_TOTAL"
          
          # ═══════════════════════════════════════════════════════════
          # 🎰 RANDOM QUOTE  
          # ═══════════════════════════════════════════════════════════
          QUOTES=(
            "Mỗi ngày một bước nhỏ, cả năm một hành trình vĩ đại."
            "Sự kiên trì có thể chinh phục mọi thứ. - Benjamin Franklin"
            "Consistency beats talent when talent doesn't work hard."
            "The only way to do great work is to love what you do. - Steve Jobs"
            "First, solve the problem. Then, write the code. - John Johnson"
            "Talk is cheap. Show me the code. - Linus Torvalds"
            "Cuộc hành trình ngàn dặm bắt đầu từ một bước chân. - Lão Tử"
            "Every expert was once a beginner. - Helen Hayes"
            "Success is the sum of small efforts repeated day in and day out."
            "The secret of getting ahead is getting started. - Mark Twain"
            "Make it work, make it right, make it fast. - Kent Beck"
            "Programs must be written for people to read. - Harold Abelson"
            "365 commits = 365 cơ hội để trở nên tốt hơn!"
            "Đừng sợ thất bại, hãy sợ không dám bắt đầu."
            "Code hôm nay, deploy ngày mai, thành công mãi mãi."
          )
          QUOTE="${QUOTES[$((RANDOM % ${#QUOTES[@]}))]}"
          
          # Milestone quotes
          case $NEW_STREAK in
            7) QUOTE="🔱 TUẦN LỄ ĐẦU! Bạn đã vượt qua 7 ngày!" ;;
            14) QUOTE="⚔️ FORTNIGHT! 14 ngày chiến đấu không ngừng nghỉ!" ;;
            30) QUOTE="🌕 MỘT THÁNG! Thói quen đã hình thành!" ;;
            50) QUOTE="💫 HALF CENTURY! 50 ngày - nửa đường đến 100!" ;;
            100) QUOTE="💎 CENTURY CLUB! 100 ngày - BẠN LÀ HUYỀN THOẠI!" ;;
            182) QUOTE="🎯 NỬA CHẶNG ĐƯỜNG! 182/365 - Đừng dừng lại!" ;;
            300) QUOTE="🛡️ SPARTAN! 300 ngày như chiến binh bất tử!" ;;
            365) QUOTE="👑 VƯƠNG GIẢ! 365 NGÀY - BẠN ĐÃ CHINH PHỤC!" ;;
          esac
          
          # ═══════════════════════════════════════════════════════════
          # 🏆 BUILD ACHIEVEMENT BADGES
          # ═══════════════════════════════════════════════════════════
          BADGES=""
          
          # Streak badges
          [ "$NEW_STREAK" -ge 1 ] && BADGES="${BADGES}🚀 "
          [ "$NEW_STREAK" -ge 3 ] && BADGES="${BADGES}🌸 "
          [ "$NEW_STREAK" -ge 7 ] && BADGES="${BADGES}🔱 "
          [ "$NEW_STREAK" -ge 14 ] && BADGES="${BADGES}⚔️ "
          [ "$NEW_STREAK" -ge 21 ] && BADGES="${BADGES}📚 "
          [ "$NEW_STREAK" -ge 30 ] && BADGES="${BADGES}🌕 "
          [ "$NEW_STREAK" -ge 50 ] && BADGES="${BADGES}💫 "
          [ "$NEW_STREAK" -ge 100 ] && BADGES="${BADGES}💎 "
          [ "$NEW_STREAK" -ge 150 ] && BADGES="${BADGES}🗡️ "
          [ "$NEW_STREAK" -ge 182 ] && BADGES="${BADGES}🎯 "
          [ "$NEW_STREAK" -ge 200 ] && BADGES="${BADGES}🐉 "
          [ "$NEW_STREAK" -ge 250 ] && BADGES="${BADGES}🦸 "
          [ "$NEW_STREAK" -ge 300 ] && BADGES="${BADGES}🛡️ "
          [ "$NEW_STREAK" -ge 365 ] && BADGES="${BADGES}👑 "
          
          # Time badges
          [ "$HOUR" -lt "06" ] && BADGES="${BADGES}🌅 "
          [ "$HOUR" -ge "23" ] && BADGES="${BADGES}🦉 "
          
          # Commit count badges
          [ "$NEW_TOTAL" -ge 50 ] && BADGES="${BADGES}📦 "
          [ "$NEW_TOTAL" -ge 100 ] && BADGES="${BADGES}🏛️ "
          [ "$NEW_TOTAL" -ge 250 ] && BADGES="${BADGES}🚂 "
          [ "$NEW_TOTAL" -ge 500 ] && BADGES="${BADGES}🏆 "
          
          # ═══════════════════════════════════════════════════════════
          # 📝 UPDATE STATS.JSON
          # ═══════════════════════════════════════════════════════════
          cat > data/stats.json << EOF
          {
            "currentStreak": $NEW_STREAK,
            "longestStreak": $NEW_STREAK,
            "totalCommits": $NEW_TOTAL,
            "startDate": "2026-01-01",
            "lastCommitDate": "$TODAY",
            "dayOfYear": $DAY_OF_YEAR,
            "progress": "$PROGRESS%"
          }
          EOF
          
          # ═══════════════════════════════════════════════════════════
          # 🎨 UPDATE SVG BANNER
          # ═══════════════════════════════════════════════════════════
          cp assets/banner-template.svg assets/banner.svg
          sed -i "s/DAY_NUM/$DAY_OF_YEAR/g" assets/banner.svg
          sed -i "s/STREAK_NUM/$NEW_STREAK/g" assets/banner.svg
          sed -i "s/COMMIT_NUM/$NEW_TOTAL/g" assets/banner.svg
          sed -i "s/PERCENT/$PROGRESS/g" assets/banner.svg
          sed -i "s/PROGRESS_WIDTH/$PROGRESS_WIDTH/g" assets/banner.svg
          
          # ═══════════════════════════════════════════════════════════
          # 📄 UPDATE README.MD
          # ═══════════════════════════════════════════════════════════
          
          # Create visual progress bar (30 chars)
          FILLED=$((DAY_OF_YEAR * 30 / 365))
          EMPTY=$((30 - FILLED))
          PBAR=""
          for i in $(seq 1 $FILLED); do PBAR="${PBAR}▓"; done
          for i in $(seq 1 $EMPTY); do PBAR="${PBAR}░"; done
          
          cat > README.md << 'HEADER'
          <div align="center">
          
          # 🌟 HÀNH TRÌNH 365 NGÀY - 2026 🌟
          
          ![GitHub Streak Banner](assets/banner.svg)
          
          [![Daily Commit](https://github.com/minhminh24x/chuoi-git-hub/actions/workflows/daily-commit.yml/badge.svg)](https://github.com/minhminh24x/chuoi-git-hub/actions)
          
          *"Mỗi ngày một bước nhỏ, cả năm một hành trình vĩ đại."*
          
          </div>
          
          ---
          
          HEADER
          
          cat >> README.md << STATS
          ## 📅 Ngày $DAY_OF_YEAR/365 — $TODAY_DISPLAY
          
          | 🔥 Streak | 💻 Commits | 📈 Progress | 🎯 Target |
          |:---------:|:----------:|:-----------:|:---------:|
          | **$NEW_STREAK ngày** | **$NEW_TOTAL** | **$PROGRESS%** | **365** |
          
          ### 🎮 Progress Bar
          
          \`\`\`
          $PBAR $PROGRESS% ($DAY_OF_YEAR/365)
          \`\`\`
          
          ---
          
          ## 🏆 Thành Tựu Đã Đạt Được
          
          <div align="center">
          
          $BADGES
          
          </div>
          
          <details>
          <summary>📋 <b>Xem tất cả thành tựu</b></summary>
          
          | Icon | Thành Tựu | Điều Kiện | Status |
          |:----:|-----------|:---------:|:------:|
          STATS
          
          # Achievement table rows with better icons
          echo "| 🚀 | Bước Đầu Tiên | 1 ngày | ✅ |" >> README.md
          [ "$NEW_STREAK" -ge 3 ] && echo "| 🌸 | Hattsune | 3 ngày | ✅ |" >> README.md || echo "| 🌸 | Hattsune | 3 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 7 ] && echo "| 🔱 | Tuần Lễ Đầu | 7 ngày | ✅ |" >> README.md || echo "| 🔱 | Tuần Lễ Đầu | 7 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 14 ] && echo "| ⚔️ | Chiến Binh | 14 ngày | ✅ |" >> README.md || echo "| ⚔️ | Chiến Binh | 14 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 21 ] && echo "| 📚 | Học Viên | 21 ngày | ✅ |" >> README.md || echo "| 📚 | Học Viên | 21 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 30 ] && echo "| 🌕 | Tháng Đầu | 30 ngày | ✅ |" >> README.md || echo "| 🌕 | Tháng Đầu | 30 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 50 ] && echo "| 💫 | Half Century | 50 ngày | ✅ |" >> README.md || echo "| 💫 | Half Century | 50 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 100 ] && echo "| 💎 | CENTURY | 100 ngày | ✅ |" >> README.md || echo "| 💎 | CENTURY | 100 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 150 ] && echo "| 🗡️ | Samurai | 150 ngày | ✅ |" >> README.md || echo "| 🗡️ | Samurai | 150 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 182 ] && echo "| 🎯 | Nửa Chặng Đường | 182 ngày | ✅ |" >> README.md || echo "| 🎯 | Nửa Chặng Đường | 182 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 200 ] && echo "| 🐉 | Huyền Thoại | 200 ngày | ✅ |" >> README.md || echo "| 🐉 | Huyền Thoại | 200 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 250 ] && echo "| 🦸 | Siêu Nhân | 250 ngày | ✅ |" >> README.md || echo "| 🦸 | Siêu Nhân | 250 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 300 ] && echo "| 🛡️ | SPARTAN | 300 ngày | ✅ |" >> README.md || echo "| 🛡️ | SPARTAN | 300 ngày | ⏳ |" >> README.md
          [ "$NEW_STREAK" -ge 365 ] && echo "| 👑 | VƯƠNG GIẢ 365 | 365 ngày | ✅ |" >> README.md || echo "| 👑 | VƯƠNG GIẢ 365 | 365 ngày | ⏳ |" >> README.md
          
          echo "" >> README.md
          echo "</details>" >> README.md
          echo "" >> README.md
          
          cat >> README.md << QUOTE
          ---
          
          ## 💬 Quote Hôm Nay
          
          > *"$QUOTE"*
          
          ---
          
          <div align="center">
          
          *Cuộc hành trình ngàn dặm bắt đầu từ một bước chân.* — Lão Tử
          
          **🚀 Let's go 2026!**
          
          </div>
          QUOTE
          
          # ═══════════════════════════════════════════════════════════
          # 🔧 GIT CONFIG & COMMIT
          # ═══════════════════════════════════════════════════════════
          git config --local user.email "loclm9824@gmail.com"
          git config --local user.name "minhminh24x"
          
          EMOJIS=("🌟" "💪" "🚀" "✨" "🎯" "🌱" "💡" "⚡" "🔥" "🎉")
          mkdir -p logs
          
          for i in $(seq 1 $COMMIT_COUNT); do
            EMOJI=${EMOJIS[$RANDOM % ${#EMOJIS[@]}]}
            
            echo "" >> logs/commit-log.md
            echo "## $EMOJI Day $DAY_OF_YEAR/365 - $TODAY_DISPLAY [$i/$COMMIT_COUNT]" >> logs/commit-log.md
            echo "- ⏰ $TIME | 🔥 Streak: $NEW_STREAK | 💻 Total: $NEW_TOTAL" >> logs/commit-log.md
            echo "---" >> logs/commit-log.md
            
            git add .
            git commit -m "$EMOJI Day $DAY_OF_YEAR/365 — $TODAY_DISPLAY | 🔥 $NEW_STREAK days | [$i/$COMMIT_COUNT]"
          done
          
          git push
          echo "🎉 Done! Day $DAY_OF_YEAR | Streak: $NEW_STREAK | Total: $NEW_TOTAL"

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39d353"/>
      <stop offset="100%" style="stop-color:#26a641"/>
    </linearGradient>
    <linearGradient id="fireGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#f7931e"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGradient)" rx="15"/>
  
  <!-- Border glow -->
  <rect x="2" y="2" width="796" height="196" fill="none" stroke="url(#greenGradient)" stroke-width="2" rx="14" opacity="0.5"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold">
    🌟 Hành Trình 365 Ngày - 2026 🌟
  </text>
  
  <!-- Stats boxes -->
  <!-- Day counter -->
  <rect x="50" y="70" width="150" height="80" fill="#21262d" rx="10" stroke="#30363d" stroke-width="1"/>
  <text x="125" y="100" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">📅 NGÀY</text>
  <text x="125" y="135" text-anchor="middle" fill="url(#greenGradient)" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold" filter="url(#glow)">83</text>
  
  <!-- Streak counter -->
  <rect x="220" y="70" width="150" height="80" fill="#21262d" rx="10" stroke="#30363d" stroke-width="1"/>
  <text x="295" y="100" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">🔥 STREAK</text>
  <text x="295" y="135" text-anchor="middle" fill="url(#fireGradient)" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold" filter="url(#glow)">83</text>
  
  <!-- Total commits -->
  <rect x="390" y="70" width="150" height="80" fill="#21262d" rx="10" stroke="#30363d" stroke-width="1"/>
  <text x="465" y="100" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">💻 COMMITS</text>
  <text x="465" y="135" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold">492</text>
  
  <!-- Progress -->
  <rect x="560" y="70" width="190" height="80" fill="#21262d" rx="10" stroke="#30363d" stroke-width="1"/>
  <text x="655" y="100" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">📊 TIẾN ĐỘ</text>
  <text x="655" y="135" text-anchor="middle" fill="#39d353" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold">22.7%</text>
  
  <!-- Progress bar -->
  <rect x="50" y="165" width="700" height="20" fill="#21262d" rx="10"/>
  <rect x="50" y="165" width="159" height="20" fill="url(#greenGradient)" rx="10"/>
  
  <!-- Quote -->
  <text x="400" y="183" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-style="italic">
    "QUOTE_TEXT"
  </text>
</svg>
